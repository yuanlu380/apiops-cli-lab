# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/apiops-cli/main/schemas/v1/override-config.schema.json
# APIM Override Configuration for dev environment
# Customize resource properties for this specific environment
# For full format details and examples, see:
# https://github.com/Azure/apiops-cli/blob/main/docs/guides/environment-overrides.md

# Uncomment this block only when publishing multiple environments (dev/qa/prod)
# to a single shared APIM instance. For dedicated-APIM-per-environment setups
# (the default), leave commented out.
# See: https://github.com/Azure/apiops-cli/blob/main/docs/guides/multi-environment-shared-apim.md
#
# environment:
#   namePrefix: "dev-"    # e.g. "dev-", "qa-", "prod-"
#   # nameSuffix: ""                  # optional
#   apiPathPrefix: "dev/" # applied to Api properties.path unless per-API override present
#   # appliesTo:                      # optional; defaults to Api, Product, NamedValue, Backend, Logger,
#   #   - Api                         #   PolicyFragment, VersionSet, Tag, Group, Subscription, Workspace
#   #   - Product

# Override named values (e.g., API keys, connection strings)
# namedValues:
#   - name: api-key
#     properties:
#       value: "dev-api-key-value"
#   - name: connection-string
#     properties:
#       value: "{#[DB_Connection_String]#}"
#   - name: secret-from-keyvault
#     properties:
#       keyVault:
#         secretIdentifier: "https://dev-kv.vault.azure.net/secrets/my-secret"
#         identityClientId: "00000000-0000-0000-0000-000000000000"

# Override backend URLs per environment
# backends:
#   - name: backend-api
#     properties:
#       url: "https://dev-api.example.com"
#   - name: legacy-backend
#     properties:
#       url: "https://dev-legacy.example.com"
#       resourceId: "/subscriptions/.../sites/dev-backend"

# Override API service URLs (with optional nested sub-resource overrides)
# apis:
#   - name: echo-api
#     properties:
#       serviceUrl: "https://dev-echo.example.com"
#   - name: petstore-api
#     properties:
#       serviceUrl: "https://dev-petstore.example.com"
#       displayName: "Petstore API (dev)"
#     diagnostics:
#       - name: applicationinsights
#         properties:
#           loggerId: "appinsights-logger-dev"
#           verbosity: Error
#     policies:
#       - name: policy
#         properties:
#           format: rawxml

# Override diagnostic logger references
# diagnostics:
#   - name: applicationinsights
#     properties:
#       loggerId: "appinsights-logger-dev"
#       verbosity: Error

# Override logger credentials or resource IDs
# loggers:
#   - name: appinsights-logger
#     properties:
#       loggerType: applicationInsights
#       resourceId: "/subscriptions/xxxxx/resourceGroups/dev-rg/providers/microsoft.insights/components/dev-appinsights"
#       isBuffered: true
#       credentials:
#         instrumentationKey: "<APP-INSIGHTS-INSTRUMENTATION-KEY>"

# Override service-level policies
# policies:
#   - name: policy
#     properties:
#       format: rawxml

# Override gateway properties
# gateways:
#   - name: on-prem-gateway
#     properties:
#       locationData:
#         name: "dev datacenter"

# Override version sets, groups, subscriptions, products, tags, policy fragments
# versionSets:
#   - name: my-version-set
#     properties:
#       displayName: "My Version Set (dev)"
# products:
#   - name: starter
#     properties:
#       displayName: "Starter Plan (dev)"
# tags:
#   - name: env-tag
#     properties:
#       displayName: "dev"
